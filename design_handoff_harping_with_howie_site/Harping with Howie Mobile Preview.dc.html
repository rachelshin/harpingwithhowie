<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>body{margin:0;background:#d9d6cc;font-family:Karla,sans-serif}*{box-sizing:border-box}a{color:inherit}a:hover{color:inherit}</style>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;800&display=swap" rel="stylesheet">
</helmet>
<section data-screen-label="Mobile" style="padding:80px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:10px;max-width:900px">
    <div style="font:800 14px/1 Karla;letter-spacing:3px;text-transform:uppercase;color:#0B0B14">Harping with Howie · Mobile · 390 × 844</div>
    <div style="font:400 20px/1.45 Karla;color:#0B0B14">The live site at phone width. Each screen scrolls on its own, so you can swipe through it.</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:60px;align-items:flex-start">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="5">
      <div style="display:flex;flex-direction:column;gap:14px">
        <span style="font:600 18px/1 Karla;color:#0B0B14">{{ s.label }}</span>
        <div style="width:414px;padding:12px;background:#151515;border-radius:52px;box-shadow:0 30px 60px rgba(0,0,0,.25)">
          <iframe src="{{ s.src }}" title="{{ s.label }}" style="display:block;width:390px;height:844px;border:0;border-radius:40px;background:#B9E4F4"></iframe>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const f = 'Harping%20with%20Howie%20Site.dc.html';
    return {
      screens: [
        { label: 'Hero', src: f },
        { label: 'About', src: f + '#about' },
        { label: 'Hosts', src: f + '#hosts' },
        { label: 'Support', src: f + '#support' },
        { label: 'Tune in + footer', src: f + '#listen' },
      ],
    };
  }
}
</script>
</body>
</html>
